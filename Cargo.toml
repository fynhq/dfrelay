[package]
name = "dfrelay"
version = "1.5.0"
edition = "2021"
rust-version = "1.89"
description = "DFRelay terminal proxy manager"
license = "MIT"

[[bin]]
name = "dfr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
flate2 = "1"
if-addrs = "0.15"
jiff = "1"
libc = "0.2"
rand = "0.10"
ratatui = "0.30"
# reqwest 0.13 switches to rustls-platform-verifier, which fails in Termux/Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
unicode-width = "0.2"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "z"
