[package]
name = "dfrelay"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "DFRelay terminal proxy manager"
license = "MIT"

[[bin]]
name = "dfr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
flate2 = "1"
if-addrs = "0.15"
libc = "0.2"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"
url = "2"
zip = "2"

[dev-dependencies]
tempfile = "3"
