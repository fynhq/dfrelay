name: CI

# Validation only. Release packaging and publishing are handled separately.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests on musl
        run: cargo test --locked --target x86_64-unknown-linux-musl

  # Public-surface guard: reject private-document references, local environment
  # narration, verification trailers, and local paths in new commit messages
  # and tracked files. It scans only the new range, so historical content does
  # not make every push fail.
  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check public surface
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            before="$PR_BASE"
            after="$PR_HEAD"
          else
            before="$BEFORE"
            after="$AFTER"
          fi
          if ! git cat-file -e "$before" 2>/dev/null; then
            if git cat-file -e "$after^" 2>/dev/null; then
              before="$after^"
            else
              before="$after"
            fi
          fi
          python3 .github/scripts/check_public_surface.py --range "$before..$after" --tree
          if [ "$REF_TYPE" = "tag" ]; then
            python3 .github/scripts/check_public_surface.py --tag "$REF_NAME"
          fi

  android:
    name: Android arm64 build check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-arm64

      - name: Configure Android NDK
        uses: ./.github/actions/android-ndk-setup

      - name: Build Android release binary
        run: cargo build --locked --release --target aarch64-linux-android

      - name: Verify ELF target
        uses: ./.github/actions/android-ndk-setup
        with:
          binary: target/aarch64-linux-android/release/dfr
